
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Business Questionnaire</title>

  <style>
    
* {
  box-sizing: border-box;
}

:root {
  --primary: #0f766e;
  --primary-dark: #115e59;
  --navy: #142b45;
  --background: #f3f7fb;
  --border: #dbe4ed;
  --muted: #64748b;
  --text: #1e293b;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 24px 14px 40px;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--background);
  color: var(--text);
  line-height: 1.6;
}

.container {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 26px 22px;
  background: #ffffff;
  border: 1px solid #e6edf4;
  border-radius: 18px;
  box-shadow: 0 12px 35px rgba(20, 43, 69, 0.08);
}

h1 {
  margin: 0 0 12px;
  padding: 22px 12px;
  text-align: center;
  color: #ffffff;
  background: var(--navy);
  border-radius: 12px;
  font-size: clamp(23px, 5vw, 30px);
  line-height: 1.3;
}

.intro {
  margin: 15px 0 26px;
  color: var(--muted);
  text-align: center;
  font-size: 15px;
}

h2 {
  margin: 28px 0 14px;
  padding-bottom: 9px;
  color: var(--navy);
  font-size: 21px;
  border-bottom: 2px solid #e8f3f2;
}

label {
  display: block;
  margin-top: 17px;
  margin-bottom: 7px;
  font-weight: 600;
  font-size: 15px;
}

input:not([type="checkbox"]),
select,
textarea {
  display: block;
  width: 100%;
  min-height: 49px;
  padding: 12px 14px;
  font: inherit;
  font-size: 16px;
  color: var(--text);
  background: #ffffff;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
}

fieldset {
  margin: 28px 0;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: #fbfdff;
}

legend {
  padding: 0 8px;
  color: var(--navy);
  font-weight: 700;
  font-size: 19px;
}

fieldset label {
  margin-top: 18px;
  font-weight: 500;
  line-height: 1.5;
}

fieldset select,
fieldset textarea {
  margin-top: 8px;
}

.signature-box {
  margin-top: 12px;
  overflow: hidden;
  background: #ffffff;
  border: 2px dashed #94a3b8;
  border-radius: 12px;
}

#signature {
  display: block;
  width: 100%;
  height: 180px;
  background: #ffffff;
  touch-action: none;
  cursor: crosshair;
}

#clearSignature {
  margin-top: 12px;
  padding: 11px 16px;
  color: var(--navy);
  background: #e8eef5;
  border: 1px solid #d5dee8;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 600;
}

#clearSignature:active {
  background: #dbe5ef;
}

.hint {
  color: var(--muted);
  font-size: 13px;
}

.consent {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  margin-top: 24px;
  padding: 15px;
  background: #f0fdfa;
  border: 1px solid #b9e5df;
  border-radius: 11px;
  font-size: 14px;
  line-height: 1.6;
}

.consent input {
  flex: 0 0 auto;
  width: 19px;
  height: 19px;
  margin: 3px 0 0;
  accent-color: var(--primary);
}

#submitButton {
  display: block;
  width: 100%;
  min-height: 52px;
  margin-top: 22px;
  padding: 14px 18px;
  color: #ffffff;
  background: var(--primary);
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 5px 12px rgba(15, 118, 110, 0.18);
}

#submitButton:active {
  background: var(--primary-dark);
  transform: scale(0.99);
}

button:focus-visible {
  outline: 3px solid #5eead4;
  outline-offset: 3px;
}

.message {
  padding: 10px 0;
  font-weight: 600;
  overflow-wrap: anywhere;
}

@media (max-width: 480px) {
  body {
    padding: 12px 8px 28px;
  }

  .container {
    padding: 16px 13px;
    border-radius: 13px;
  }

  h1 {
    padding: 19px 9px;
  }

  fieldset {
    padding: 12px;
  }

  legend {
    font-size: 17px;
  }

  h2 {
    font-size: 19px;
  }

  #signature {
    height: 170px;
  }
}

  <script>
    const form = document.getElementById("businessForm");
    const canvas = document.getElementById("signature");
    const ctx = canvas.getContext("2d");
    const clearButton = document.getElementById("clearSignature");
    const signatureStatus =
      document.getElementById("signatureStatus");
    const message = document.getElementById("message");

    let drawing = false;
    let hasSignature = false;
    let lastX = 0;
    let lastY = 0;

    function setupCanvas() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;

      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;

      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#111827";
    }

    setupCanvas();

    function getPosition(event) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    canvas.addEventListener("pointerdown", function(event) {
      event.preventDefault();
      drawing = true;

      const pos = getPosition(event);
      lastX = pos.x;
      lastY = pos.y;

      canvas.setPointerCapture(event.pointerId);

      // A tap also counts as a mark.
      ctx.beginPath();
      ctx.arc(lastX, lastY, 1.3, 0, Math.PI * 2);
      ctx.fill();

      hasSignature = true;
      signatureStatus.textContent = "Signature added.";
    });

    canvas.addEventListener("pointermove", function(event) {
      if (!drawing) return;
      event.preventDefault();

      const pos = getPosition(event);

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();

      lastX = pos.x;
      lastY = pos.y;
    });

    function stopDrawing() {
      drawing = false;
    }

    canvas.addEventListener("pointerup", stopDrawing);
    canvas.addEventListener("pointercancel", stopDrawing);

    clearButton.addEventListener("click", function() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasSignature = false;
      signatureStatus.textContent = "Signature cleared. Sign again.";
      message.textContent = "";
    });

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      message.textContent = "";

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      if (!hasSignature) {
        signatureStatus.textContent =
          "Please draw your signature before continuing.";
        canvas.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
        return;
      }

      message.textContent =
        "Success! All fields are valid. No information was sent or saved.";
    });

    // Refit the drawing surface when the screen changes size.
    // Avoid resizing while a signature is in progress.
    window.addEventListener("resize", function() {
      if (!hasSignature && !drawing) {
        setupCanvas();
      }
    });
